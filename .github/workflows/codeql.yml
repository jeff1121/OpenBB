# 多數專案不需要調整這個 workflow；提交到 repository 後即可使用。
#
# 若需要覆蓋分析語言、加入自訂查詢或自訂建置邏輯，可在此調整。
#
# ******** 注意 ********
# 請確認下方 `language` matrix 包含此 repository 需要分析的 CodeQL 支援語言。
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "develop", "PR-review", "gh-pages", "main" ]
    paths-ignore:
      - 'cookiecutter/**'
  pull_request:
    branches: [ "develop", "PR-review", "gh-pages", "main" ]
    paths-ignore:
      - 'cookiecutter/**'
  schedule:
    - cron: '37 0 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner 規格會影響 CodeQL 分析時間。更多資訊：
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # 若分析時間過長，可考慮使用更大的 runner 或資源更多的機器。
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # 所有 workflow 都需要
      security-events: write

      # 擷取內部或私有 CodeQL packs 時需要
      packages: read

      # 私有 repository 的 workflow 才需要
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
          config-file: ''
        - language: python
          build-mode: none
          config-file: ''
        - language: rust
          build-mode: none
          config-file: .github/codeql/desktop-only.yml
        - language: javascript-typescript
          build-mode: none
          config-file: .github/codeql/desktop-only.yml
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # 若使用手動建置，可在 `github/codeql-action/init` 前加入環境設定步驟。
    # 例如安裝 compiler 或 runtime（`actions/setup-node` 等）。
    # - name: 設定 runtime（範例）
    #   uses: actions/setup-example@v1

    # 初始化 CodeQL 掃描工具。
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ${{ matrix.config-file }}
        # 使用更完整的安全與品質查詢，並以 "+" 保留 config-file 中既有查詢設定。
        queries: +security-extended,security-and-quality

    # 若某個語言的分析因無法自動建置而失敗，請把上方 matrix 中該語言的
    # build-mode 改成 "manual"，再在此步驟補上實際建置指令。
    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo '若你對一個或多個分析語言使用 "manual" build mode，' \
          '請將此處替換為實際建置指令，例如：'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
