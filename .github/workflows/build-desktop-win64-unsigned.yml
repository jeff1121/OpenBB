name: build-windows-x64-unsigned

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      OPENSSL_COPY_SKIP_EXISTING: "1"
      UNSIGNED_TAURI_CONFIG: '{"build":{"beforeBundleCommand":null},"bundle":{"createUpdaterArtifacts":false}}'

    steps:
      - uses: actions/checkout@v6

      - name: Cache vcpkg
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('desktop/**/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Bootstrap vcpkg
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.VCPKG_ROOT }}")) {
            git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
          }
          & "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.bat"

      - name: Install OpenSSL using vcpkg
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: ${{ env.VCPKG_ROOT }}/vcpkg install openssl:x64-windows --vcpkg-root ${{ env.VCPKG_ROOT }}

      - name: Set OpenSSL env
        shell: bash
        run: |
          echo "OPENSSL_DIR=${{ env.VCPKG_ROOT }}/installed/x64-windows" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=${{ env.VCPKG_ROOT }}/installed/x64-windows/include" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=${{ env.VCPKG_ROOT }}/installed/x64-windows/lib" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        run: npm install

      - name: Copy OpenSSL DLLs from vcpkg
        run: npm run openssl:copy

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-x64-cargo-registry-${{ hashFiles('desktop/**/Cargo.lock') }}
          restore-keys: |
            windows-x64-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: desktop/target
          key: windows-x64-cargo-build-${{ hashFiles('desktop/**/Cargo.lock') }}
          restore-keys: |
            windows-x64-cargo-build-

      - name: Clean old bundle artifacts
        shell: pwsh
        run: |
          $bundlePath = "${{ github.workspace }}/desktop/target/x86_64-pc-windows-msvc/release/bundle"
          if (Test-Path $bundlePath) {
            Remove-Item -Path $bundlePath -Recurse -Force
          }

      - name: Build Tauri App without bundling
        shell: pwsh
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --no-bundle --config $env:UNSIGNED_TAURI_CONFIG

      - name: Bundle unsigned NSIS installer
        shell: pwsh
        run: npm run tauri bundle -- --target x86_64-pc-windows-msvc --bundles nsis --no-sign --config $env:UNSIGNED_TAURI_CONFIG

      - name: Organize artifact
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $outDir = "${{ github.workspace }}/desktop/unsigned-installer"
          New-Item -ItemType Directory -Force -Path $outDir
          $installer = Get-ChildItem -Path "${{ github.workspace }}/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item -Path $installer.FullName -Destination (Join-Path $outDir "Open-Data-Platform_${version}_x86_64_unsigned.exe") -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-unsigned-artifacts
          path: ${{ github.workspace }}/desktop/unsigned-installer/
